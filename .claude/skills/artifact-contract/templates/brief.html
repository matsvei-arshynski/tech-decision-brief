<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0;
    --accent: #0b5cad; --panel: #f6f8fa; --met: #1a7f37; --unmet: #cf222e; --unknown: #9a6700;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --border: #3d444d;
      --accent: #58a6ff; --panel: #151b23; --met: #3fb950; --unmet: #f85149; --unknown: #d29922;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 32px 16px 64px; }
  header { border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  header p { color: var(--muted); margin: 4px 0 16px; font-size: 14px; }
  h1 { font-size: 28px; line-height: 1.25; margin: 0 0 8px; }
  h2 { font-size: 21px; margin: 40px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  h3 { font-size: 17px; margin: 24px 0 8px; }
  a { color: var(--accent); }
  #decision { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px 20px 12px; }
  #decision h2 { border: 0; margin-top: 16px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 15px; }
  th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
  th { background: var(--panel); }
  .met { color: var(--met); font-weight: 600; }
  .unmet { color: var(--unmet); font-weight: 600; }
  .unknown { color: var(--unknown); font-weight: 600; }
  sup.cite a { text-decoration: none; font-size: 12px; }
  ol.sources { padding-left: 0; list-style: none; font-size: 14px; }
  ol.sources li { margin: 4px 0; word-break: break-word; }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
  @media print { body { font-size: 12pt; } #decision { break-inside: avoid; } a { color: inherit; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>{{TITLE}}</h1>
    <p>Run {{RUN_ID}} · {{DATE}}</p>
  </header>
  <section id="decision">{{SECTION_1}}</section>
  <section id="context">{{SECTION_2}}</section>
  <section id="options">{{SECTION_3}}</section>
  <section id="matrix">{{SECTION_4}}</section>
  <section id="recommendation">{{SECTION_5}}</section>
  <section id="risks">{{SECTION_6}}</section>
  <section id="adoption">{{SECTION_7}}</section>
  <section id="open-questions">{{SECTION_8}}</section>
  <section id="sources">{{SECTION_9}}</section>
  <footer>Generated by the tech-brief workflow. Approved by a human before rendering.</footer>
</main>
</body>
</html>
